name: Release

# Publishes to npm when a GitHub release is published, using npm trusted
# publishing (OIDC). No NPM_TOKEN secret is needed or used.
#
# This listens only to published releases, not to pushed v* tags:
# `gh release create vX.Y.Z` pushes the tag and publishes the release together,
# so triggering on both would run the publish twice.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher config.
    environment: forclaude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm publish --provenance --access public
